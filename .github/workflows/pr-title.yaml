name: PR Labeler and Validator

on:
  pull_request_target:
    types: [opened, edited]

jobs:
  label-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      should_validate: ${{ steps.check.outputs.should_validate }}
      pr_title: ${{ steps.check.outputs.pr_title }}
      pr_body: ${{ steps.check.outputs.pr_body }}
    steps:
    - name: Auto Label and Check PR
      id: check
      uses: actions/github-script@v7
      with:
        script: |
          const prTitle = context.payload.pull_request.title;
          let shouldValidate = false;

          if (/^\[deathcon\]/i.test(prTitle)) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['deathcon']
            });
            console.log('Added "deathcon" label to PR');
            shouldValidate = true;
          }
          
          core.setOutput('should_validate', shouldValidate);
          core.setOutput('pr_title', prTitle);
          core.setOutput('pr_body', context.payload.pull_request.body);

  validate-pr-title:
    needs: label-pr
    if: needs.label-pr.outputs.should_validate == 'true'
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Audit Network Calls
        uses: step-security/harden-runner@v2
        
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create PR message file
        run: |
          mkdir -p /tmp
          cat > /tmp/pr-message.txt << 'EOF'
          ${{ needs.label-pr.outputs.pr_title }}
          
          ${{ needs.label-pr.outputs.pr_body }}
          EOF
          
      - name: Validate PR title
        run: |
          echo "Validating PR title: ${{ needs.label-pr.outputs.pr_title }}"
          echo "End"
