name: PR Labeler and Validator

on:
  pull_request_target:
    types: [opened, edited]

permissions:
  contents: write       # Enables attacks 1 & 2
  actions: write        # Enables attack 3
  pull-requests: write  # For the auto-labeler functionality
  
jobs:
  label-pr:
    runs-on: ubuntu-latest
    outputs:
      should_validate: ${{ steps.check.outputs.should_validate }}
    steps:
    - name: Auto Label and Check PR
      id: check
      uses: actions/github-script@v7
      with:
        script: |
          const prTitle = context.payload.pull_request.title;
          let shouldValidate = false;

          if (/^\[deathcon\]/i.test(prTitle)) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['deathcon']
            });
            console.log('Added "deathcon" label to PR');
            shouldValidate = true;
          }
          
          core.setOutput('should_validate', shouldValidate);

  validate-pr-title:
    needs: label-pr
    if: needs.label-pr.outputs.should_validate == 'true'
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Audit Network Calls
        uses: step-security/harden-runner@v2
        
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate PR title
        run: |
          echo "Validating PR title: ${{ github.event.pull_request.title }}"
          echo "End"
