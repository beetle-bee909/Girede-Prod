name: PR Labeler

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  label-pr:
    runs-on: ubuntu-latest
    steps:
    - name: Auto Label PR by Title
      uses: actions/github-script@v7
      with:
        script: |
          const prTitle = context.payload.pull_request.title;
          
          // Check if title starts with [Deathcon] (case insensitive)
          if (/^\[deathcon\]/i.test(prTitle)) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['deathcon']
            });
            console.log('Added "deathcon" label to PR');
          } else {
            console.log('PR title does not match pattern, skipping');
          }
